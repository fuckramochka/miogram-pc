name: Build Desktop (Tauri)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build-tauri:
    name: Build Tauri (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows'
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Configure Telegram API environment
        shell: bash
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID || '2496' }}" >> .env
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH || '8da85b0d5b16225240404d8033c9c583' }}" >> .env

      - name: Build Web Bundle
        run: npx cross-env NODE_OPTIONS=--max-old-space-size=8192 npm run build:production

      - name: Build Desktop via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Miogram Desktop ${{ github.ref_name }}'
          releaseBody: 'Miogram Web Z Desktop release built with Tauri.'
          releaseDraft: false
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miogram-${{ matrix.platform }}
          path: |
            tauri/target/**/bundle/nsis/*.exe
            tauri/target/**/bundle/msi/*.msi
            tauri/target/**/bundle/dmg/*.dmg
            tauri/target/**/bundle/macos/*.app
            tauri/target/**/bundle/appimage/*.AppImage
            tauri/target/**/bundle/deb/*.deb
          if-no-files-found: warn
